<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a3667" />
    <title>SuSu · Sin conexión</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a3667;
        color: #fcedad;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 120px; height: 120px; border-radius: 24px; }
      h1 { font-family: Georgia, serif; font-weight: normal; font-size: 32px; margin: 24px 0 8px; }
      p { max-width: 320px; line-height: 1.5; margin: 0 auto 24px; color: #d6e4f0; }
      button {
        border: 0; border-radius: 999px; padding: 14px 24px;
        background: #e7bd3c; color: #0a3667; font-weight: bold; font-size: 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="SuSu" />
      <h1>Sin conexión</h1>
      <p>SuSu necesita internet para cargar tus proyectos. Revisa tu conexión e inténtalo de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
